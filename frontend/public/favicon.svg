<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Travel Art">
  <!-- The compass from the wordmark, cut down until it survives 16px.
       What was here was a teal arrow on navy - teal being the palette this
       site retired for clashing with its own gold logo. The detailed rose in
       the PNGs keeps its hairline rays and its N/S letters, which at a browser
       tab's size collapse into a faint smudge on white, so this keeps only the
       four cardinal points and sets them on the brand navy: a dark ground so
       the mark holds its shape against a light tab strip and a dark one. -->
  <rect width="64" height="64" rx="13" fill="#0B1F3F"/>
  <!-- Ordinal points: mass around the centre, no detail to lose when small. -->
  <path d="M32 15 L36.4 27.6 L49 32 L36.4 36.4 L32 49 L27.6 36.4 L15 32 L27.6 27.6 Z"
        fill="#B99851" opacity="0.5" transform="rotate(45 32 32)"/>
  <!-- Cardinal star, the part that has to read at 16 pixels. -->
  <path d="M32 6 L37.7 26.3 L58 32 L37.7 37.7 L32 58 L26.3 37.7 L6 32 L26.3 26.3 Z"
        fill="#B99851"/>
  <circle cx="32" cy="32" r="3.4" fill="#0B1F3F"/>
</svg>
