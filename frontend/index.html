<!doctype html>
<!-- The site ships light. The `class="dark"` that used to sit here pinned every
     page to the dark token set, and because DarkModeToggle is not rendered
     anywhere in the app - it appears only in its own unit test - there was no
     way for a visitor to leave it. The dark tokens remain defined in
     index.css, so adding the class back restores that theme wholesale. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Art — Résidences d’artistes en hôtellerie d’exception</title>
    <meta name="description" content="Travel Art réunit les hôtels d’exception et les artistes : résidences, concerts et expositions, accueillis là où le travail trouve sa place." />
    
    <!-- The opening hero photograph. imagesrcset selects on width x DPR,
         the same rule heroVariant() uses, so this fetches the file the CSS
         will ask for and not a second copy of it. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/images/hero/ombre-1440.webp"
      imagesrcset="/images/hero/ombre-960.webp 960w, /images/hero/ombre-1440.webp 1440w, /images/hero/ombre.webp 2400w"
      imagesizes="100vw"
    />
    
    <!-- Fonts are self-hosted via fontsource and imported from src/index.css,
         so there is no render-blocking third-party stylesheet here. -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- What sat here was ~105 lines defining .float-animation, .gradient-text,
         .glow-effect, .typing-animation, .hero-image, .float-enhanced,
         .drop-shadow-lg and .drop-shadow-md. None of the eight appears
         anywhere in src/, and .gradient-text was defined twice with different
         colours. Two of them - .drop-shadow-lg and .drop-shadow-md - shadowed
         real Tailwind utility names, so any future use of those utilities
         would have silently got these instead. Only the scroll behaviour
         earned its place; index.css overrides it to auto under
         prefers-reduced-motion. -->
    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
