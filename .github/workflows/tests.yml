name: Automated Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Setup test database
        working-directory: ./backend
        env:
          # schema.prisma declares directUrl = env("DIRECT_URL"). Prisma fails
          # validation with P1012 if it is unset, even against a database that
          # needs no separate direct connection, so it is pointed at the same
          # service.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma generate
          npx prisma migrate deploy
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db
          # Must be at least 32 characters or config.ts refuses to boot the app
          # under NODE_ENV=production; the previous value was 22.
          JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-32plus
        run: npm test
      
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          name: backend-coverage

  frontend-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    # The e2e job boots the real backend, which speaks to Postgres. It used to
    # point DATABASE_URL at file:./test.db, a SQLite URL that schema.prisma's
    # postgresql provider rejects outright, so the server could never have
    # started. Nothing caught it because this workflow only triggered on main
    # and develop, neither of which exists in this repository.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Start backend server
        working-directory: ./backend
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          npm start &
          sleep 5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-32plus
          PORT: 4000
      
      - name: Run Cypress tests
        working-directory: ./frontend
        run: npm run test:e2e:headless
        env:
          CYPRESS_baseUrl: http://localhost:4000
      
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
      
      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-videos
          path: frontend/cypress/videos

  all-tests:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Test Summary
        run: |
          echo "✅ All tests completed successfully!"
          echo "Backend API Tests: ✅"
          echo "Frontend E2E Tests: ✅"














