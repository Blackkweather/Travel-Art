name: CI

# One workflow for every push and pull request. It runs the same checks as a
# local `npm test`: the backend suites against a disposable Postgres with
# row-level security on (see backend/jest.env.cjs), the frontend unit tests,
# and both builds. Vercel deploys on its own; nothing here deploys.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Matches the defaults in backend/jest.env.cjs, so the suites need no
      # database settings of their own.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: travelart_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5433/travelart_test
      DIRECT_URL: postgresql://postgres:test@localhost:5433/travelart_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint (errors only)
        run: npx eslint src --ext .ts --quiet

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Migrate the test database
        run: npx prisma migrate deploy

      # The app role and its policies live outside the migrations (see
      # prisma/rls/apply.ts). The password is the test-only one jest.env.cjs uses.
      - name: Apply row-level security
        run: npx tsx prisma/rls/apply.ts
        env:
          APP_DB_PASSWORD: apppw-local-test-only-2026

      - name: Test
        run: npx jest --ci

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # The frontend imports the shared schemas from backend/src/shared, which
      # resolve their own packages (zod) from backend/node_modules.
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Lint (errors only)
        working-directory: frontend
        run: npx eslint . --ext ts,tsx --quiet

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build (type-check included)
        working-directory: frontend
        run: npm run build
